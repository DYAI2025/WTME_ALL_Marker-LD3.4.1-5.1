id: ATO_SLANG_TOKEN
frame:
  signal:
  - Slang-Ausdruck
  concept: Umgangssprache
  pragmatics: informelle Kommunikation
  narrative: token
pattern:
- (?i)\b(krass|geil|chillig|alter|digga|safe|läuft|nice|yolo|swag)\b
examples:
  positive:
  - "Das ist krass!"
  - "Das ist geil!"
  - "Das ist chillig."
  - "Alter, was geht ab?"
  - "Digga, alles klar?"
  - "Safe!"
  - "Läuft bei dir."
  - "Das ist nice."
  - "Yolo!"
  - "Swag!"
  negative:
  - Ich finde, wir sollten das in Ruhe besprechen.
  - Das ist ein guter Punkt, den du da machst.
  - Ich verstehe deine Perspektive.
  - Lass uns gemeinsam eine Loesung finden.
  - Mir ist aufgefallen, dass wir unterschiedlich denken.
  - Ich moechte verstehen, was du meinst.
  - Das klingt nach einem wichtigen Thema fuer dich.
tags:
