id: CLU_HOSTILE_DETACHED
schema: LeanDeep
version: '5.1'
layer: CLU
lang: de
description: 'Feindselig–distanziertes Muster: hoher Verachtungsanteil mit anschließender oder paralleler Distanz/Abbruch.'
frame:
  signal:
  - Wiederholte Verachtung + Makro-/Mikroeskalation, oft mit Rückzug
  concept: Hostile–Detached Dyad
  pragmatics: Chronische Entwertung + Distanz
  narrative: cold_loop
patterns: []
examples:
  positive:
  - Sarkasmus/Häme häufen sich, danach Funkstille für Stunden/Tage.
  - Spott (🙄) im Streit, kurze Rechtfertigung, dann Gesprächsabbruch.
  - Mehrere herabsetzende Nachrichten, später kühle Ein-Wort-Antworten.
  - "Makro-Eskalation mit Verachtung, anschließend: 'Wie du meinst.'"
  - Zunehmende Ironie/Spott, dann Rückzug in Schweigen.
  - Regelmäßig 'so peinlich' + '…' → Distanz verfestigt sich.
  - Spöttische Seitenhiebe über Tage, dann keine Reaktion mehr.
  negative:
  - Ich finde, wir sollten das in Ruhe besprechen.
  - Das ist ein guter Punkt, den du da machst.
  - Ich verstehe deine Perspektive.
  - Lass uns gemeinsam eine Loesung finden.
  - Mir ist aufgefallen, dass wir unterschiedlich denken.
  - Ich moechte verstehen, was du meinst.
  - Das klingt nach einem wichtigen Thema fuer dich.
tags:
- cluster
- conflict
- gottman
- hostile_detached
- toxic
rating: 1
composed_of:
- SEM_CONFLICT_MACRO
- SEM_CONFLICT_MICRO
activation:
  rule: SUM(weight) >= 0.75 WITHIN 72h
scoring:
  base: 2.1
  weight: 1.3
  decay: 0.01
  formula: logistic
  multiplier: 2.0
ld5_family: CONFLICT
ld5_multiplier: 2.0
ld5_cooldown: 5
window:
  messages: 6
