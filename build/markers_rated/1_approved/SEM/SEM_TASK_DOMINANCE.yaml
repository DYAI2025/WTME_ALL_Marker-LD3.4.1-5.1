name: SEM_TASK_DOMINANCE
label: "Aufgaben-Dominanz"
class: semantic
version: 1.0
languages: [de]
meaning: "Task-Turns dominieren gegenüber Beziehungs-/Emotionssprache"
formula: "Task_Turns / Total_Turns >= 0.6 AND (ATO_AFFECT_FLAT >= 0.5 OR ATO_COURTESY_FORMAL
  >= 0.5)"
inputs:
  counters:
  - ATO_AFFECT_FLAT
  - ATO_COURTESY_FORMAL
  - ATO_PROTOCOL_LANG
  - ATO_TOPIC_SHIFT_TO_TASK
  - ATO_ACK_MICRO
window:
  size_messages: 30
threshold: 1
semiotic:
  mode: symbolic
  level: semantic
  object: "task_focus"
  connotation: ["aufgabe", "dominanz"]
  interpretant: "effect_on_state: {task_dominance: +0.25, intimacy: -0.1}"
