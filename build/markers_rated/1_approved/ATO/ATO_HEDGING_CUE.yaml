id: ATO_HEDGING_CUE
schema_version: "LD-3.3"
lang: de
category: ATOMIC
description: "Atomic pattern for hedging and uncertainty expressions"
frame:
  signal: ["Unsicherheitsformel"]
  concept: "Hedging"
  pragmatics: "Abschwächung"
  narrative: "token"
pattern:
- "vielleicht"
- "wohl"
- "glaube"
- "unsicher"
- "weiß nicht"
examples:
  positive:
  - "Vielleicht ist das richtig."
  - "Ich glaube, das passt."
  - "Ich bin unsicher."
  - "Weiß nicht, ob ich das kann."
  - "Es wird wohl klappen."
  negative:
  - Ich finde, wir sollten das in Ruhe besprechen.
  - Das ist ein guter Punkt, den du da machst.
  - Ich verstehe deine Perspektive.
  - Lass uns gemeinsam eine Loesung finden.
  - Mir ist aufgefallen, dass wir unterschiedlich denken.
  - Ich moechte verstehen, was du meinst.
  - Das klingt nach einem wichtigen Thema fuer dich.
tags: [hedging, atomic]
