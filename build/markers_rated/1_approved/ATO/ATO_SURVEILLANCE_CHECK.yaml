id: ATO_SURVEILLANCE_CHECK
version: "3.3"
lang: de
frame:
  signal:
  - "Überwachendes Prüfen von Geräten/Accounts"
  concept: "Kontrollhandlung"
  pragmatics: "Vertrauensbruchrisiko"
  narrative: "Sicherheitszwang"
pattern:
- '(?i)\b(handy|telefon|chat|account)\s*(prüfen|checken|durchsuchen)\b'
- '(?i)\b(nachrichten)\s*(lesen|kontrollieren)\b'
- '(?i)\b(in\s+(mein|dein)\s+handy\s+schau\w*)\b'
examples:
  positive:
  - "Hättest du in mein Handy geschaut …"
  - "Ich habe die Chats geprüft."
  - "Den Account kontrollieren."
  - "Nachrichten durchsuchen."
  - "Ich checke dein Telefon."
  negative:
  - Ich finde, wir sollten das in Ruhe besprechen.
  - Das ist ein guter Punkt, den du da machst.
  - Ich verstehe deine Perspektive.
  - Lass uns gemeinsam eine Loesung finden.
  - Mir ist aufgefallen, dass wir unterschiedlich denken.
  - Ich moechte verstehen, was du meinst.
  - Das klingt nach einem wichtigen Thema fuer dich.
tags: [surveillance, control, atomic]
