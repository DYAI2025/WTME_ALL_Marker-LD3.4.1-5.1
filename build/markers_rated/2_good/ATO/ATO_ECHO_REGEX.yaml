schema: "LeanDeep"
version: "3.4"
id: ATO_ECHO_REGEX
frame:
  signal: ["regex"]
  concept: "Echo/Repetition"
  pragmatics: "Stochastik"
  narrative: "surface"
pattern:
  regex: "\\b(\\w+)\\b.*\\b\\1\\b"
examples:
  positive:
  - "wir drehen uns im Kreis … wie vorhin"
  - "das hatten wir schon … nochmal von vorne"
  - "immer wieder die gleiche Frage"
  - "ich wiederhole mich … schon wieder"
  - "zurück am Anfang … ohne Fortschritt"
  negative:
  - manchmal wieder die gleiche Frage
  - Ich finde, wir sollten das in Ruhe besprechen.
  - Das ist ein guter Punkt, den du da machst.
  - Ich verstehe deine Perspektive.
  - Lass uns gemeinsam eine Loesung finden.
  - Mir ist aufgefallen, dass wir unterschiedlich denken.
  - Ich moechte verstehen, was du meinst.
