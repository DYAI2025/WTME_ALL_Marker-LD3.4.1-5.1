schema: "LeanDeep"
version: "3.4"
id: ATO_NEGATION
frame:
  signal: ["negation"]
  concept: "Verneinung / Ablehnung"
  pragmatics: "Grenze / Abgrenzung"
  narrative: "interaction"
tags: [negation, boundary]
pattern:
  regex: "\\b(nein|nicht|keinesfalls|auf keinen fall|stimmt nicht)\\b"
  flags: ["IGNORECASE"]
examples:
  positive:
  - "Nein."
  - "Das stimmt nicht."
  - "Keinesfalls."
  - "Auf keinen Fall."
  - "Nicht so."
  - "Das sehe ich nicht so."
  negative:
  - wenige.
  - Auf wenige Fall.
  - Ich finde, wir sollten das in Ruhe besprechen.
  - Das ist ein guter Punkt, den du da machst.
  - Ich verstehe deine Perspektive.
  - Lass uns gemeinsam eine Loesung finden.
  - Mir ist aufgefallen, dass wir unterschiedlich denken.
