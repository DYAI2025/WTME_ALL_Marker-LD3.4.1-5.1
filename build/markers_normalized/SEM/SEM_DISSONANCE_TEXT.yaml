id: SEM_DISSONANCE_TEXT
schema: LeanDeep
version: '5.1'
layer: SEM
lang: de
description: Absolutbehauptung kollidiert mit Gegenbeleg oder Rationalisierung.
frame:
  signal:
  - "'immer/nie' + späterer Gegenbeleg/Begründungsschwenk"
  concept: Kognitive Dissonanz
  pragmatics: Inkonsistenz stabilisieren
  narrative: Selbstrechtfertigung
patterns: []
examples:
  positive:
  - Das klappt nie... objektiv war heute aber eine Ausnahme.
  - Ich bin immer pünktlich... rational gesehen war der Stau schuld.
  - Sie hört nie zu... statistisch gesehen tut sie’s oft.
  - Wir gewinnen immer... logisch betrachtet war das Pech.
  - Er ist nie vorbereitet... aus Gründen der Umstände diesmal schon.
  - Immer richtig... objektiv heute daneben.
  - Nie falsch... rational betrachtet doch.
  - Immer perfekt... statistisch eher nicht.
  negative:
  - Das klappt selten... objektiv war heute aber eine Ausnahme.
  - Ich bin manchmal pünktlich... rational gesehen war der Stau schuld.
  - Sie hört selten zu... statistisch gesehen tut sie’s oft.
  - Ich finde, wir sollten das in Ruhe besprechen.
  - Das ist ein guter Punkt, den du da machst.
  - Ich verstehe deine Perspektive.
  - Lass uns gemeinsam eine Loesung finden.
tags:
- semantic
- dissonance
rating: 1
composed_of:
- ATO_ABSOLUTIZER
- ATO_RATIONALIZATION_LEX
scoring:
  base: 1.4
  weight: 1.1
metadata:
  repair_log:
  - rule: R03
    note: Feldreihenfolge normalisiert
    date: '2025-08-29'
activation:
  rule: ANY 2 IN 4 messages
window:
  messages: 4
